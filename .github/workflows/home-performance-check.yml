name: Verify home performance candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify supported Node.js runtime
        run: node scripts/check-node-version.mjs

      - name: Verify official runtime bootstrap
        run: bash scripts/deploy-cloudflare.sh --verify-only

      - name: Setup pinned WebP codecs
        uses: ./.github/actions/setup-home-webp
      # ubuntu-24.04 already provides Chrome shared libraries; the pinned binary
      # and browser tests verify them without a second unbounded apt font download.
      - name: Install pinned test dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          echo "CHROME_EXECUTABLE=$(node scripts/install-test-browser.mjs)" >> "$GITHUB_ENV"
      - name: Audit collection and deployment dependencies
        run: |
          npm audit --audit-level=high
          npm ci --prefix tools/deploy --ignore-scripts --no-fund
          npm audit --prefix tools/deploy --audit-level=high
      - name: Verify codecs and build
        run: |
          node --version
          cwebp -version
          dwebp -version
          node scripts/build-site.mjs
          node scripts/check-home-recovery.mjs capture dist "$RUNNER_TEMP/release-assets.json"
          node scripts/check-home-recovery.mjs verify dist "$RUNNER_TEMP/release-assets.json"
      - name: Run fixtures and browser regression tests without publishing data
        run: |
          node --test --test-concurrency=1 tests/*.test.mjs > "$RUNNER_TEMP/home-performance-tests.txt" 2>&1
          cat "$RUNNER_TEMP/home-performance-tests.txt"
          git diff --exit-code
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-performance-verification
          path: |
            ${{ runner.temp }}/home-performance-tests.txt
            ${{ runner.temp }}/release-assets.json
          if-no-files-found: ignore
