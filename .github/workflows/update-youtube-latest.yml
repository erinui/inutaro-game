name: Update home latest data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */4 * * *"

permissions:
  contents: write

jobs:
  update-youtube-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCdnf6zMzSdZuvUxS-CS2REQ' }}
          YOUTUBE_HANDLE: ${{ vars.YOUTUBE_HANDLE || '@えりぬい' }}
          YOUTUBE_MAX_RESULTS: "6"
        run: node scripts/update-youtube-latest.mjs

      - name: Fetch latest note articles
        env:
          NOTE_RSS_URL: "https://note.com/erinui/rss"
          NOTE_MAX_RESULTS: "6"
        run: node scripts/update-note-latest.mjs

      - name: Fetch latest SUZURI products
        env:
          SUZURI_ACCESS_TOKEN: ${{ secrets.SUZURI_ACCESS_TOKEN }}
          SUZURI_USER_NAME: "erikanuinui"
          SUZURI_MAX_RESULTS: "6"
        run: |
          if [ -z "$SUZURI_ACCESS_TOKEN" ]; then
            echo "SUZURI_ACCESS_TOKEN is not configured. Keeping the current data."
            exit 0
          fi
          node scripts/update-suzuri-latest.mjs

      - name: Commit updated home data
        run: |
          if git diff --quiet -- assets/home-city/youtube-latest.json assets/home-city/youtube-thumb-1.jpg assets/home-city/youtube-thumb-2.jpg assets/home-city/youtube-thumb-3.jpg assets/home-city/youtube-thumb-4.jpg assets/home-city/youtube-thumb-5.jpg assets/home-city/note-latest.json assets/home-city/suzuri-latest.json; then
            echo "No home data updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-city/youtube-latest.json assets/home-city/youtube-thumb-1.jpg assets/home-city/youtube-thumb-2.jpg assets/home-city/youtube-thumb-3.jpg assets/home-city/youtube-thumb-4.jpg assets/home-city/youtube-thumb-5.jpg assets/home-city/note-latest.json assets/home-city/suzuri-latest.json
          git commit -m "Update home latest data"
          git push origin HEAD:main
